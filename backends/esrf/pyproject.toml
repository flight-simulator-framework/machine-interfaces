[project]
name = "machine-interfaces-esrf"
version = "0.2.2"
description = "ESRF interfaces and machine model data for Flight Simulator."
requires-python = ">=3.11"
dependencies = [
    "machine-interfaces>=0.2.0,<0.3",
    "pytango>=10.3.1,<11",
    "pandas>=3.0.6,<4",
    "rf-track (>=2.7.3,<3.0.0)",
]

[[project.authors]]
name = "wmalek"
email = "wiktoria.malek@cern.ch"

[project.entry-points."flight_simulator.interfaces"]
ESRF = "machine_interfaces_esrf.interface_setup"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["machine_interfaces_esrf"]
exclude = ["*.o", "*.so", "*.dylib"]
