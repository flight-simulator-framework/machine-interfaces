[project]
name = "machine-interfaces-esrf"
version = "0.2.1"
description = "ESRF interfaces and machine model data for Flight Simulator."
requires-python = ">=3.11"
dependencies = [
    "machine-interfaces>=0.2.0,<0.3",
    "pytango>=10.3.1,<11",
    "pandas>=3.0.6,<4",
]

[[project.authors]]
name = "wmalek"
email = "wiktoria.malek@cern.ch"

[project.entry-points."flight_simulator.interfaces"]
ESRF = "machine_interfaces_esrf.interface_setup"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
exclude = ["**/__pycache__/**", "**/*.pyc", "**/*.o", "**/*.so", "**/*.dylib", "**/.DS_Store"]
[[tool.poetry.packages]]
include = "machine_interfaces_esrf"

[tool.poetry.dependencies]
machine-interfaces = {source = "flight-simulator"}

[[tool.poetry.source]]
name = "flight-simulator"
url = "https://gitlab.cern.ch/api/v4/groups/363527/-/packages/pypi/simple/"
priority = "explicit"
