[project]
name = "machine-interfaces-clear"
version = "0.2.0"
description = "CLEAR interfaces and machine model data for Flight Simulator."
requires-python = ">=3.11"
dependencies = [
    "machine-interfaces>=0.2.0,<0.3",
    "rf-track>=2.6.2,<3",
    "pyda (>=1.1.0,<1.2) ; python_version >= \"3.11\" and python_version < \"4\"",
    "pyda-japc (>=1.1.0,<1.2) ; python_version >= \"3.11\" and python_version < \"4\"",
    "pyrbac (>=1.0,<2) ; python_version >= \"3.11\" and python_version < \"4\"",
    "pyccda (>=1.29.4) ; python_version >= \"3.11\" and python_version < \"4\"",
    "cmmnbuild-dep-manager (>=2.13,<3) ; python_version >= \"3.11\" and python_version < \"4\"",
    "cpymad>=1,<2",
]

[[project.authors]]
name = "wmalek"
email = "wiktoria.malek@cern.ch"

[project.entry-points."flight_simulator.interfaces"]
CLEAR = "machine_interfaces_clear.interface_setup"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
exclude = ["**/__pycache__/**", "**/*.pyc", "**/*.o", "**/*.so", "**/*.dylib", "**/.DS_Store"]
[[tool.poetry.packages]]
include = "machine_interfaces_clear"

[tool.poetry.dependencies]
machine-interfaces = {source = "flight-simulator"}
pyda = {source = "cern-acc-py", python = ">=3.11,<4"}
pyda-japc = {source = "cern-acc-py", python = ">=3.11,<4"}
pyrbac = {source = "cern-acc-py", python = ">=3.11,<4"}
pyccda = {source = "cern-acc-py", python = ">=3.11,<4"}
cmmnbuild-dep-manager = {source = "cern-acc-py", python = ">=3.11,<4"}
[[tool.poetry.source]]
name = "cern-acc-py"
url = "https://acc-py-repo.cern.ch/repository/vr-py-releases/simple/"
priority = "explicit"
[[tool.poetry.source]]
name = "flight-simulator"
url = "https://gitlab.cern.ch/api/v4/groups/363527/-/packages/pypi/simple/"
priority = "explicit"
