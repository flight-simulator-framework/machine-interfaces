[project]
name = "machine-interfaces"
version = "0.1.0"
description = "Machine interface contract, accelerator adapters, registry and interface selector."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "wmalek", email = "wiktoria.malek@cern.ch"}]
dependencies = [
    "numpy>=2.4.2,<3",
    "matplotlib>=3.10.8,<4",
    "PyQt6>=6.10.2,<7",
    "scipy>=1.17.1,<2",
    "pytango (>=10.3.1,<11.0.0)",
    "pandas (>=3.0.6,<4.0.0)"
]

[project.optional-dependencies]
rftrack = ["rf-track>=2.6.2,<3"]
epics = ["pyepics>=1.0,<4"]
madx = ["cpymad>=1,<2"]
tao = ["pytao>=0.5,<2"]
analysis = ["h5py>=3,<4"]
camera-reference = ["pillow>=12.1.1,<13"]
clear = ["pyda (>=1.1.0,<1.2) ; python_version >= \"3.11\" and python_version < \"4\"", "pyda-japc (>=1.1.0,<1.2) ; python_version >= \"3.11\" and python_version < \"4\"", "pyrbac (>=1.0,<2) ; python_version >= \"3.11\" and python_version < \"4\"", "pyccda (>=1.29.4) ; python_version >= \"3.11\" and python_version < \"4\"", "cmmnbuild-dep-manager (>=2.13,<3) ; python_version >= \"3.11\" and python_version < \"4\""]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "machine_interfaces" }]

[[tool.poetry.source]]
name = "cern-acc-py"
url = "https://acc-py-repo.cern.ch/repository/vr-py-releases/simple/"
priority = "explicit"


[tool.poetry.dependencies]
pyda = {source = "cern-acc-py", python = ">=3.11,<4"}
pyda-japc = {source = "cern-acc-py", python = ">=3.11,<4"}
pyrbac = {source = "cern-acc-py", python = ">=3.11,<4"}
pyccda = {source = "cern-acc-py", python = ">=3.11,<4"}
cmmnbuild-dep-manager = {source = "cern-acc-py", python = ">=3.11,<4"}
[tool.flight-simulator.migration]
status = "local-execution-ready"
repository-dependencies = []
