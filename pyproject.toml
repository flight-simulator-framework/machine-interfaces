[project]
name = "machine-interfaces"
version = "0.1.0"
description = "Machine interface contract, accelerator adapters, registry and interface selector."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "wmalek", email = "wiktoria.malek@cern.ch"}]
dependencies = [
    "numpy>=2.4.2,<3",
    "matplotlib>=3.10.8,<4",
    "PyQt6>=6.10.2,<7",
    "scipy>=1.17.1,<2"
]

[project.optional-dependencies]
rftrack = ["rf-track>=2.6.2,<3"]
epics = ["pyepics>=1.0,<4"]
madx = ["cpymad>=1,<2"]
tao = ["pytao>=0.5,<2"]
analysis = ["h5py>=3,<4"]
camera-reference = ["pillow>=12.1.1,<13"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.flight-simulator.migration]
status = "file-layout-prepared-import-migration-pending"
repository-dependencies = []
