[project]
name = "machine-interfaces"
version = "0.2.0"
description = "Shared machine interface API, state storage and interface selection."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "wmalek", email = "wiktoria.malek@cern.ch"}]
dependencies = [
    "numpy>=2.4.2,<3",
    "matplotlib>=3.10.8,<4",
    "PyQt6>=6.10.2,<7",
    "scipy>=1.17.1,<2",
]

[project.optional-dependencies]
analysis = ["h5py>=3,<4"]
camera-reference = ["pillow>=12.1.1,<13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["machine_interfaces"]

[tool.flight-simulator.migration]
status = "local-execution-ready"
repository-dependencies = []
